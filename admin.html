<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriNext — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#f5387d; --violet:#7c3aed; --magenta-dark:#b81f5c;
    --gradient:linear-gradient(135deg,#f5387d 0%,#8b2fd8 55%,#7c3aed 100%);
    --yellow:#ffd400; --ink:#1c1524; --ink-soft:#5c5468; --ink-faint:#948da3;
    --paper:#ffffff; --cream:#faf8fb; --line:#ece6f2;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; font-size:15.5px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0;}

  /* ---- Login screen ---- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--gradient); padding:20px;
  }
  .login-card{
    background:#fff; border-radius:16px; padding:44px 40px; width:100%; max-width:380px;
    box-shadow:0 30px 60px -25px rgba(20,10,30,0.5);
  }
  .login-card h1{font-size:1.5rem; margin-bottom:6px;}
  .login-card p{color:var(--ink-soft); margin:0 0 24px 0; font-size:0.92rem;}
  .login-card input{
    width:100%; font-size:1rem; padding:12px 14px; margin-bottom:12px;
    border:1.5px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif;
  }
  .login-card button{
    width:100%; background:var(--gradient); color:#fff; border:none; border-radius:8px;
    padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1rem;
    cursor:pointer; margin-top:6px;
  }
  .login-card button:disabled{opacity:0.6; cursor:default;}
  #loginError{color:#c22b2b; font-size:0.88rem; margin-top:12px; min-height:1.2em;}

  /* ---- Dashboard ---- */
  #dashScreen{display:none;}
  header.admin-nav{
    background:var(--gradient); padding:20px 32px; display:flex; align-items:center; justify-content:space-between;
  }
  header.admin-nav h1{color:#fff; font-size:1.2rem;}
  #logoutBtn{
    background:rgba(255,255,255,0.15); color:#fff; border:1.5px solid rgba(255,255,255,0.5);
    border-radius:999px; padding:8px 18px; font-family:'Space Grotesk',sans-serif; font-weight:500;
    font-size:0.88rem; cursor:pointer;
  }
  .dash-wrap{max-width:860px; margin:0 auto; padding:36px 28px 80px 28px;}
  .filters{display:flex; gap:10px; margin-bottom:24px;}
  .filters button{
    font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:0.9rem;
    background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:8px 18px; cursor:pointer; color:var(--ink-soft);
  }
  .filters button.active{border-color:var(--magenta); color:var(--magenta-dark); background:#fdf0f5;}

  #inqList{display:flex; flex-direction:column; gap:14px;}
  .inq-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px;
    box-shadow:0 12px 30px -22px rgba(28,21,36,0.3);
  }
  .inq-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .inq-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.02rem;}
  .inq-email{color:var(--magenta-dark); font-size:0.88rem; text-decoration:none;}
  .inq-date{color:var(--ink-faint); font-size:0.8rem; white-space:nowrap;}
  .inq-msg{margin:12px 0; color:var(--ink-soft); white-space:pre-wrap; line-height:1.55;}
  .inq-actions{display:flex; gap:10px; align-items:center; margin-top:8px;}
  .inq-actions select{
    font-family:'Inter',sans-serif; font-size:0.85rem; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
  }
  .inq-actions button.del{
    background:none; border:1px solid #f1c3c3; color:#c22b2b; border-radius:6px;
    padding:6px 12px; font-size:0.85rem; cursor:pointer;
  }
  .empty-note{color:var(--ink-faint); text-align:center; padding:60px 0; font-size:0.95rem;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>NutriNext Admin</h1>
    <p>Sign in to view and manage inquiries.</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <p id="loginError"></p>
  </div>
</div>

<div id="dashScreen">
  <header class="admin-nav">
    <h1>NutriNext — Inquiries</h1>
    <button id="logoutBtn">Log out</button>
  </header>
  <div class="dash-wrap">
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="new">New</button>
      <button data-filter="read">Read</button>
      <button data-filter="replied">Replied</button>
    </div>
    <div id="inqList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ohqzelnfvrouivdenfvo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Gpu18xKpzs7wDX8cRfHLYg_vFdbO9V0";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashScreen = document.getElementById('dashScreen');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const inqList = document.getElementById('inqList');
  let allInquiries = [];
  let currentFilter = 'all';

  async function isAdmin(){
    const { data, error } = await sb.rpc('is_admin');
    return !error && data === true;
  }

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if(data.session && await isAdmin()){ showDashboard(); }
    else {
      if(data.session) await sb.auth.signOut();
      showLogin();
    }
  }

  function showLogin(){ loginScreen.style.display = 'flex'; dashScreen.style.display = 'none'; }
  function showDashboard(){ loginScreen.style.display = 'none'; dashScreen.style.display = 'block'; loadInquiries(); }

  document.getElementById('loginPassword').addEventListener('keydown', e=>{
    if(e.key === 'Enter') loginBtn.click();
  });

  loginBtn.addEventListener('click', async ()=>{
    loginError.textContent = '';
    loginBtn.disabled = true; loginBtn.textContent = 'Signing in...';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      loginBtn.disabled = false; loginBtn.textContent = 'Log in';
      loginError.textContent = error.message; return;
    }
    if(!(await isAdmin())){
      await sb.auth.signOut();
      loginBtn.disabled = false; loginBtn.textContent = 'Log in';
      loginError.textContent = "This account isn't an admin.";
      return;
    }
    loginBtn.disabled = false; loginBtn.textContent = 'Log in';
    showDashboard();
  });

  ['loginEmail','loginPassword'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key === 'Enter') loginBtn.click(); });
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    showLogin();
  });

  document.querySelectorAll('.filters button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  async function loadInquiries(){
    inqList.innerHTML = '<p class="empty-note">Loading...</p>';
    const { data, error } = await sb.from('inquiries').select('*').order('created_at', { ascending: false });
    if(error){ inqList.innerHTML = '<p class="empty-note">Could not load inquiries: '+error.message+'</p>'; return; }
    allInquiries = data || [];
    renderList();
  }

  const EMPTY_HINT = 'No inquiries here yet. If you know messages were sent, this account is probably not allowed to read them — run supabase-setup.sql and make sure you are signed in with the admin email.';

  function renderList(){
    const items = currentFilter === 'all' ? allInquiries : allInquiries.filter(i => (i.status || 'new') === currentFilter);
    if(items.length === 0){
      inqList.innerHTML = '<p class="empty-note">' + (currentFilter === 'all' ? EMPTY_HINT : 'Nothing in this filter.') + '</p>';
      return;
    }
    inqList.innerHTML = '';
    items.forEach(inq=>{
      const card = document.createElement('div');
      card.className = 'inq-card';
      const date = inq.created_at ? new Date(inq.created_at).toLocaleString() : '';
      card.innerHTML = `
        <div class="inq-top">
          <div>
            <div class="inq-name">${escapeHtml(inq.name || 'Anonymous')}</div>
            <a class="inq-email" href="mailto:${escapeHtml(inq.email||'')}">${escapeHtml(inq.email||'')}</a>
          </div>
          <div class="inq-date">${date}</div>
        </div>
        <div class="inq-msg">${escapeHtml(inq.message||'')}</div>
        <div class="inq-actions">
          <select data-id="${escapeHtml(String(inq.id))}" class="statusSelect">
            <option value="new" ${(inq.status||'new')==='new'?'selected':''}>New</option>
            <option value="read" ${inq.status==='read'?'selected':''}>Read</option>
            <option value="replied" ${inq.status==='replied'?'selected':''}>Replied</option>
          </select>
          <button class="del" data-id="${escapeHtml(String(inq.id))}">Delete</button>
        </div>
      `;
      inqList.appendChild(card);
    });

    document.querySelectorAll('.statusSelect').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const id = sel.dataset.id;
        const item = allInquiries.find(i=>String(i.id) === id);
        const previous = item ? (item.status || 'new') : 'new';
        // .select() makes Supabase return the changed rows, so a blocked update is detectable
        const { data, error } = await sb.from('inquiries').update({ status: sel.value }).eq('id', id).select();
        if(error || !data || data.length === 0){
          alert('Could not update status: ' + (error ? error.message : 'not allowed by database policy (see supabase-setup.sql).'));
          sel.value = previous;
          return;
        }
        if(item) item.status = sel.value;
        if(currentFilter !== 'all') renderList();
      });
    });
    document.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('Delete this inquiry?')) return;
        const id = btn.dataset.id;
        const { data, error } = await sb.from('inquiries').delete().eq('id', id).select();
        if(error || !data || data.length === 0){
          alert('Could not delete: ' + (error ? error.message : 'not allowed by database policy (see supabase-setup.sql).'));
          return;
        }
        allInquiries = allInquiries.filter(i=>String(i.id) !== id);
        renderList();
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // keep the screen in sync if the session expires or the user signs out elsewhere
  sb.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_OUT') showLogin();
  });

  checkSession();
</script>

</body>
</html>
